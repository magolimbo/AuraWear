<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 550" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
