    <path d="M502 280 H598" marker-start="url(#end)" marker-end="url(#end)"/>
    <path d="M670 310 V390" marker-end="url(#end)"/>
    <!-- enrichment back into clean views -->
    <path d="M780 432 H810 V132 H782" marker-end="url(#end)"/>
    <!-- human in the loop -->
    <path d="M930 140 V280 H816 A6 6 0 0 0 804 280 H742" marker-end="url(#end)"/>
    <path d="M1000 140 V452 H782" marker-end="url(#end)"/>
  </g>

