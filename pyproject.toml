[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["config", "data_gen", "ingestion", "enrichment", "eval", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
